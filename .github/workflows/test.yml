name: Rust

on:
  push:
    branches: [main, rune-rewrite]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keep test builds small: Rune is a large dependency tree.
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_TEST_STRIP: debuginfo
    steps:
      - name: Checkout repository
        # v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        # Rune's winit keyboard library needs xkbcommon headers on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon0

      - name: Rust toolchain
        # rust-toolchain.toml pins 1.99.1 with clippy + rustfmt.
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustup component add rust-src

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        # Live/network smoke tests are #[ignore] and stay offline in CI.
        run: cargo test --workspace
