[package]
name = "argus-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "argus"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1", features = ["tooling"] }
argus-core = { path = "../argus-core" }
argus-data = { path = "../argus-data" }
argus-map = { path = "../argus-map" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
